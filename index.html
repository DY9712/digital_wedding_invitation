<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f7f0e4">
<meta name="format-detection" content="telephone=no">
<title>梁文锟 &amp; 何可慧 · 婚礼邀请</title>
<meta name="description" content="2027年1月1日 星期五 晚上 · 东莞沙田海鲜长廊。18:00 迎宾 / 19:00 仪式 / 19:30 晚宴，诚邀您见证我们的婚礼。">
<meta property="og:type" content="website">
<meta property="og:title" content="梁文锟 &amp; 何可慧 · 婚礼邀请">
<meta property="og:description" content="2027年1月1日 星期五 晚上 · 东莞沙田海鲜长廊">
<meta property="og:image" content="assets/photo.jpg">
<meta name="twitter:card" content="summary_large_image">
<style>
  @font-face{font-family:"NotoSerifWeb";font-style:normal;font-weight:400;font-display:swap;src:url("assets/fonts/notoserifsc-400.woff2") format("woff2")}
  @font-face{font-family:"NotoSerifWeb";font-style:normal;font-weight:600;font-display:swap;src:url("assets/fonts/notoserifsc-600.woff2") format("woff2")}
  @font-face{font-family:"PlayfairWeb";font-style:normal;font-weight:400;font-display:swap;src:url("assets/fonts/playfair-400.woff2") format("woff2")}
  @font-face{font-family:"PlayfairWeb";font-style:normal;font-weight:600;font-display:swap;src:url("assets/fonts/playfair-600.woff2") format("woff2")}
  @font-face{font-family:"VibesWeb";font-style:normal;font-weight:400;font-display:swap;src:url("assets/fonts/greatvibes-400.woff2") format("woff2")}

  :root{
    --cream:#f7f0e4;
    --cream-2:#efe3d0;
    --red:#8d1915;
    --red-deep:#7e0200;
    --ink:#42201c;
    --ink-soft:#6f5b50;
    --gold:#b28f5a;
    --serif:"Songti SC","STSong","NotoSerifWeb","Noto Serif SC","Source Han Serif SC","SimSun",Georgia,serif;
    --latin:"Didot","Bodoni 72","PlayfairWeb","Playfair Display",Georgia,"Times New Roman",serif;
    --script:"Snell Roundhand","Apple Chancery","VibesWeb","Segoe Script","Brush Script MT",cursive;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{
    background:var(--cream);color:var(--ink);
    font-family:var(--serif);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .sheet{max-width:100%;margin:0 auto;position:relative}

  /* ---------- 纸纹 & 花瓣 ---------- */
  .grain{
    position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:60;opacity:.3;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.55'/></svg>");
    mix-blend-mode:multiply;
  }
  @supports not (mix-blend-mode: multiply){ .grain{display:none} }
  #petals{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:1}

  /* ---------- 封面 ---------- */
  .hero{
    position:relative;z-index:2;min-height:100vh;min-height:100svh;
    display:flex;flex-direction:column;background:var(--cream);
  }
  .hero-photo{
    position:relative;flex:1 1 auto;min-height:54vh;min-height:54svh;overflow:hidden;
    background:var(--red-deep);
  }
  .hero-photo img{
    position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover;
    object-position:50% 16%;
    animation:heroIn 2.6s cubic-bezier(.22,.61,.36,1) both;
  }
  @keyframes heroIn{from{transform:scale(1.1);opacity:.15}to{transform:scale(1);opacity:1}}
  .hero-photo::after{
    content:"";position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;
    background:
      linear-gradient(to bottom,rgba(70,2,0,.40) 0%,rgba(70,2,0,0) 24%),
      linear-gradient(to bottom,rgba(247,240,228,0) 82%,rgba(247,240,228,.55) 93%,var(--cream) 100%);
  }
  .hero-text{position:relative;padding:6px 24px 52px;text-align:center}
  .eyebrow{
    font-family:var(--latin);font-size:11px;letter-spacing:.42em;
    text-transform:uppercase;color:var(--gold);margin:0 0 14px;text-indent:.42em;
  }
  .display{
    font-family:var(--latin);font-weight:400;
    font-size:clamp(26px,8.4vw,40px);letter-spacing:.3em;text-indent:.3em;
    margin:0;color:var(--red);line-height:1.15;
  }
  .script{
    font-family:var(--script);font-size:clamp(22px,6.6vw,30px);
    margin:10px 0 0;color:#a02a24;
  }
  .hero-line{width:52px;height:1px;background:var(--gold);opacity:.6;margin:18px auto 0}
  .hero-meta{
    font-size:11px;letter-spacing:.36em;text-indent:.36em;color:var(--gold);
    margin:14px 0 0;font-family:var(--latin);
  }
  .hint{
    position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    z-index:3;font-size:9px;letter-spacing:.3em;color:rgba(141,25,21,.38);
    animation:bob 2.6s ease-in-out infinite;white-space:nowrap;
    display:flex;align-items:center;gap:8px;transition:opacity .6s ease;
  }
  .hint svg{width:11px;height:11px;margin-top:1px}
  .hint.gone{opacity:0}
  @keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,5px)}}

  /* ---------- 通用段落 ---------- */
  main{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:0 32px}
  section{opacity:0;transform:translateY(26px);transition:opacity 1s ease,transform 1s cubic-bezier(.22,.61,.36,1)}
  section.in{opacity:1;transform:none}

  .orn{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto;width:100%}
  .orn i{display:block;height:1px;flex:0 0 58px;background:linear-gradient(90deg,transparent,var(--gold))}
  .orn i:last-child{background:linear-gradient(90deg,var(--gold),transparent)}
  .orn b{width:5px;height:5px;background:var(--gold);transform:rotate(45deg);flex:0 0 auto}

  /* ---------- 名字 ---------- */
  .names-block{padding:50px 0 8px;text-align:center}
  .names{
    font-size:clamp(31px,10vw,42px);font-weight:600;letter-spacing:.08em;
    margin:14px 0 0;line-height:1.4;color:var(--ink);
  }
  .names .amp{
    font-family:var(--latin);font-weight:400;color:var(--red);
    font-size:.62em;margin:0 .3em;vertical-align:.08em;
  }
  .en-names{
    font-family:var(--script);font-size:21px;color:var(--red);
    margin:2px 0 0;opacity:.85;
  }

  /* ---------- 日期 ---------- */
  .date-block{padding:32px 0 4px;text-align:center}
  .date-row{display:flex;align-items:baseline;justify-content:center;gap:13px;font-family:var(--latin)}
  .date-year{font-size:21px;color:var(--ink-soft);letter-spacing:.12em}
  .date-day{font-size:clamp(36px,11.4vw,50px);color:var(--red);letter-spacing:.04em;line-height:1}
  .date-wd{font-family:var(--serif);font-size:16px;color:var(--ink-soft);letter-spacing:.14em}
  .date-note{font-family:var(--serif);font-size:12px;color:var(--gold);letter-spacing:.34em;margin:13px 0 0;text-indent:.34em}

  /* ---------- 倒计时 ---------- */
  .count{display:flex;justify-content:center;gap:9px;margin:24px 0 0}
  .count div{
    min-width:64px;padding:11px 2px 9px;border:1px solid rgba(178,143,90,.4);
    display:flex;flex-direction:column;align-items:center;gap:3px;
  }
  .count b{font-family:var(--latin);font-weight:400;font-size:25px;color:var(--red);line-height:1}
  .count span{font-size:10px;letter-spacing:.2em;color:var(--ink-soft);text-indent:.2em}

  /* ---------- 流程 ---------- */
  .schedule{padding:46px 0 0}
  .sched-row{
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    padding:19px 0;border-bottom:1px solid rgba(178,143,90,.28);
  }
  .sched-row:first-child{border-top:1px solid rgba(178,143,90,.28)}
  .sched-row .label{font-size:17px;letter-spacing:.3em;text-indent:.3em;color:var(--ink)}
  .sched-row .icon{color:var(--red);display:flex;align-items:center;padding:0 22px}
  .sched-row .icon svg{width:26px;height:26px}
  .sched-row .time{
    font-family:var(--latin);font-size:21px;color:var(--red);letter-spacing:.1em;text-align:right;
  }
  .schedule .caption{
    text-align:center;font-size:11px;letter-spacing:.3em;color:var(--gold);
    margin:20px 0 0;text-indent:.3em;
  }

  /* ---------- 寄语 ---------- */
  .quote{padding:50px 0 6px;text-align:center}
  .quote p{
    font-size:16.5px;line-height:2.2;letter-spacing:.16em;text-indent:.16em;
    color:#5b4438;margin:0;
  }

  /* ---------- 地点 ---------- */
  .location{padding:44px 0 0;text-align:center}
  .loc-name{
    display:flex;align-items:center;justify-content:center;gap:8px;margin:14px 0 0;
    font-size:22px;letter-spacing:.12em;font-weight:600;color:var(--ink);
  }
  .loc-name svg{width:18px;height:18px;color:var(--red);flex:0 0 auto}
  .loc-addr{font-size:13px;color:var(--ink-soft);letter-spacing:.12em;margin:9px 0 0}
  .btn-row{display:flex;gap:10px;justify-content:center;margin:24px 0 0}
  .btn{
    display:inline-flex;align-items:center;gap:7px;
    padding:12px 20px;border:1px solid var(--red);color:var(--red);
    font-size:13px;letter-spacing:.18em;text-indent:.18em;text-decoration:none;
    background:transparent;font-family:var(--serif);cursor:pointer;
    transition:background .3s,color .3s;
  }
  .btn:active{background:var(--red);color:var(--cream)}
  .btn.solid{background:var(--red);color:var(--cream)}
  .btn.solid:active{background:#6d120f}
  .btn svg{width:13px;height:13px}

  /* ---------- 印章 ---------- */
  .seal-wrap{padding:54px 0 0;text-align:center}
  .seal{
    display:inline-flex;align-items:center;justify-content:center;
    width:62px;height:62px;border-radius:5px;background:var(--red);
    color:#f7f0e4;font-size:32px;line-height:1;font-weight:600;
    box-shadow:inset 0 0 0 5px var(--red),inset 0 0 0 6px rgba(247,240,228,.5);
  }
  .see-you{font-family:var(--script);font-size:25px;color:#a02a24;margin:18px 0 0}
  footer{padding:4px 0 58px;text-align:center}
  .footer-note{font-family:var(--latin);font-size:9px;letter-spacing:.32em;color:rgba(111,91,80,.5);margin:24px 0 0;text-indent:.32em}

  @media (min-width:700px){
    body{background:#e9ddca}
    .sheet{
      max-width:560px;background:var(--cream);
      box-shadow:0 24px 80px rgba(80,30,20,.18);
    }
    .hero{min-height:auto}
    .hero-photo{height:78vh;min-height:0}
    #petals{max-width:560px;left:50%;transform:translateX(-50%)}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    section{opacity:1;transform:none}
  }
</style>
</head>
<body>
<div class="grain"></div>
<canvas id="petals"></canvas>

<div class="sheet">
  <header class="hero">
    <div class="hero-photo">
      <img src="assets/photo.jpg" alt="梁文锟与何可慧的婚纱照">
    </div>
    <div class="hero-text">
      <p class="eyebrow">Save the date</p>
      <h1 class="display">OUR WEDDING</h1>
      <p class="script">Welcome to our wedding</p>
      <div class="hero-line"></div>
      <p class="hero-meta">2027 · 01 · 01</p>
    </div>
    <div class="hint" id="hint">向 下 滑 动<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4.6 6 8.4l4-3.8" fill="none" stroke="currentColor" stroke-width="1"/></svg></div>
  </header>

  <main>
    <section class="names-block">
      <div class="orn"><i></i><b></b><i></i></div>
      <p class="eyebrow" style="margin-top:26px">The wedding of</p>
      <h2 class="names">梁文锟<span class="amp">&amp;</span>何可慧</h2>
      <p class="en-names">Wenkun &amp; Kehui</p>
    </section>

    <section class="date-block">
      <div class="date-row">
        <span class="date-year">2027</span>
        <span class="date-day">01/01</span>
        <span class="date-wd">星期五</span>
      </div>
      <p class="date-note">晚上 · 敬备喜宴</p>
      <div class="count" id="countdown">
        <div><b data-d>—</b><span>天</span></div>
        <div><b data-h>—</b><span>时</span></div>
        <div><b data-m>—</b><span>分</span></div>
        <div><b data-s>—</b><span>秒</span></div>
      </div>
    </section>

    <section class="schedule">
      <div class="sched-row">
        <div class="label">迎宾</div>
        <div class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
            <path d="M7.4 3.5h9.2M7.4 3.5c0 4.6 1.2 6.8 4.6 8.4 3.4-1.6 4.6-3.8 4.6-8.4M12 12v7.6"/>
            <path d="M7.6 20.4c1.4-1.4 2.9-2 4.4-2s3 .6 4.4 2"/>
          </svg>
        </div>
        <div class="time">18:00</div>
      </div>
      <div class="sched-row">
        <div class="label">仪式</div>
        <div class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
            <circle cx="9.3" cy="14.6" r="4.7"/>
            <circle cx="14.7" cy="14.6" r="4.7"/>
            <path d="M9.3 6.2l1.4 1.6-1.4 1.6-1.4-1.6z" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="time">19:00</div>
      </div>
      <div class="sched-row">
        <div class="label">晚宴</div>
        <div class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 17.4a7 7 0 0 1 14 0"/>
            <path d="M12 10.4v-1"/>
            <circle cx="12" cy="8.6" r="0.95"/>
            <path d="M2.8 17.4h18.4"/>
            <path d="M6.4 20.3h11.2"/>
          </svg>
        </div>
        <div class="time">19:30</div>
      </div>
      <p class="caption">恭 候 光 临</p>
    </section>

    <section class="quote">
      <p>择一良日，与你共赴白头<br>备一席欢喜，候你如约而来</p>
    </section>

    <section class="location">
      <div class="orn"><i></i><b></b><i></i></div>
      <p class="eyebrow" style="margin-top:24px">Location</p>
      <div class="loc-name">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/>
          <circle cx="12" cy="10" r="2.6" fill="currentColor" stroke="none"/>
        </svg>
        沙田海鲜长廊
      </div>
      <p class="loc-addr">广东省东莞市环湖北路68号</p>
      <div class="btn-row">
        <a class="btn solid" id="navBtn" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <path d="M3 11l18-8-8 18-2.2-7.8z"/>
          </svg>导航前往
        </a>
        <button class="btn" id="copyBtn" type="button">复制地址</button>
      </div>
    </section>

    <footer>
      <div class="seal-wrap"><div class="seal">囍</div></div>
      <p class="see-you">See you there</p>
      <p class="footer-note">2027.01.01 &nbsp;·&nbsp; DONGGUAN</p>
    </footer>
  </main>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- 倒计时 ---------------- */
  var target = new Date("2027-01-01T17:30:00+08:00").getTime();
  var box = document.getElementById("countdown");
  var dEl = box.querySelector("[data-d]"), hEl = box.querySelector("[data-h]"),
      mEl = box.querySelector("[data-m]"), sEl = box.querySelector("[data-s]");
  function pad(n){ return n < 10 ? "0" + n : "" + n; }
  function tick(){
    var diff = target - Date.now();
    if (diff <= 0){
      dEl.textContent = "0"; hEl.textContent = "00"; mEl.textContent = "00"; sEl.textContent = "00"; return;
    }
    var s = Math.floor(diff / 1000);
    dEl.textContent = Math.floor(s / 86400);
    hEl.textContent = pad(Math.floor(s % 86400 / 3600));
    mEl.textContent = pad(Math.floor(s % 3600 / 60));
    sEl.textContent = pad(s % 60);
  }
  tick(); setInterval(tick, 1000);

  /* ---------------- 滚动显现 ---------------- */
  var secs = document.querySelectorAll("section");
  if ("IntersectionObserver" in window){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); }
      });
    }, { threshold: 0.14, rootMargin: "0px 0px -6% 0px" });
    secs.forEach(function(s){ io.observe(s); });
  } else {
    secs.forEach(function(s){ s.classList.add("in"); });
  }

  /* ---------------- 地址 / 导航 ---------------- */
  var ADDR = "广东省东莞市环湖北路68号 沙田海鲜长廊";
  var nav = document.getElementById("navBtn");
  nav.href = "https://uri.amap.com/search?keyword=" + encodeURIComponent("沙田海鲜长廊") +
             "&city=" + encodeURIComponent("东莞") + "&callnative=1";
  var copy = document.getElementById("copyBtn");
  copy.addEventListener("click", function(){
    var done = function(){
      copy.textContent = "已复制";
      setTimeout(function(){ copy.textContent = "复制地址"; }, 1800);
    };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ADDR).then(done, done);
    } else {
      var ta = document.createElement("textarea");
      ta.value = ADDR; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch(e){}
      document.body.removeChild(ta); done();
    }
  });

  /* ---------------- 提示淡出 ---------------- */
  var hint = document.getElementById("hint");
  window.addEventListener("scroll", function(){
    if (hint) hint.classList.toggle("gone", window.scrollY > 40);
  }, { passive: true });

  /* ---------------- 花瓣 ---------------- */
  var cv = document.getElementById("petals");
  var ctx = cv.getContext("2d");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var W = 0, H = 0, petals = [], dpr = Math.min(window.devicePixelRatio || 1, 2);

  function newPetal(init){
    return {
      x: Math.random() * W,
      y: init ? Math.random() * H : -20 - Math.random() * 120,
      r: 2.0 + Math.random() * 3.2,
      vy: 0.16 + Math.random() * 0.40,
      vx: (Math.random() - 0.5) * 0.22,
      a: Math.random() * Math.PI * 2,
      va: (Math.random() - 0.5) * 0.012,
      o: 0.09 + Math.random() * 0.14,
      hue: Math.random() < 0.7 ? "141,25,21" : "178,143,90"
    };
  }
  function resize(){
    W = cv.clientWidth || window.innerWidth;
    H = cv.clientHeight || window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var n = Math.max(8, Math.round(Math.min(16, W / 28)));
    petals = [];
    for (var i = 0; i < n; i++) petals.push(newPetal(true));
  }
  function draw(){
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < petals.length; i++){
      var p = petals[i];
      p.y += p.vy;
      p.x += p.vx + Math.sin(p.y / 90) * 0.15;
      p.a += p.va;
      if (p.y > H + 24 || p.x < -30 || p.x > W + 30) petals[i] = newPetal(false);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.a);
      ctx.fillStyle = "rgba(" + p.hue + "," + p.o + ")";
      ctx.beginPath();
      ctx.ellipse(0, 0, p.r, p.r * 0.6, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    if (!reduce) requestAnimationFrame(draw);
  }
  resize();
  window.addEventListener("resize", resize);
  draw();
})();
</script>
</body>
</html>
